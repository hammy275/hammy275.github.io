services:
  javadocs:
    build:
      context: .
    volumes:
      - ./docs:/build
      - ./starlight-docs:/docs-copy:ro
    user: root
    command: bash -c "
      mkdir /docs/ &&
      rsync -av --exclude="node_modules/" --exclude="dist/" --exclude=".vscode/" --exclude=".astro/" /docs-copy/ /docs/ &&
      cd /docs &&
      npm install &&
      npm run build &&
      cd /immersive-mc && 
      git pull &&
      ./gradlew javadoc &&
      cd / &&
      rm -rf /build/* &&
      cp -r /docs/dist/* /build &&
      cp -r /immersive-mc/common/build/docs/javadoc /build/javadoc &&
      touch /build/.nojekyll &&
      echo immersivemcwiki.hammy275.com > /build/CNAME && 
      rm -rf /docs &&
      echo Done! &&
      exit
      "